# S^3 × S^3 (CS) — PCGrad gradient surgery + long Adam + L-BFGS + diagnostics + float64.
#
# Addresses the observed Nij↔overlap gradient conflict that's left every prior
# run with overlap converged (ACS loss ~0.13) but Nij stuck (CS loss ~7.6).
# PCGrad (Yu et al. 2020) projects conflicting gradients to remove the
# component that would hurt the other task, then sums. Adam-phase only.
#
# Builds on the strongest known no-bias setup:
#   * Overlap pretraining → non-trivial chart-consistent start (no CE bias)
#   * 30000 Adam epochs, cosine T_max=30000, eta_min=1e-7
#   * L-BFGS phase 2 for asymptotic Adam-can't-reach regime (no PCGrad in LBFGS)
#   * precision: 64 (PCGrad + LBFGS both sensitive to gradient noise)
#   * diagnostics on: block_diagonality, nijenhuis_rank, Chern at end

geometry:
  manifold_type: "sphere_product"
  real_dimension_alpha: 3
  real_dimension_beta: 3

network:
  hidden_layers: [512, 1024, 1024, 1024, 1024, 512]
  activation: "gelu"
  use_fourier_features: true
  fourier_scale: 1.0
  num_fourier_features: 128
  initialization: "xavier"
  matrix_exp_terms: null
  use_residual_blocks: true

training:
  epochs: 30000
  batch_size: 500
  precision: 64
  learning_rate: 1.0e-3
  scheduler: "cosine"
  scheduler_params:
    T_max: 30000
    eta_min: 1.0e-7
  optimizer: "adamw"
  weight_decay: 1.0e-5

  # PCGrad — the new lever for the Nij↔overlap conflict (Adam phase only)
  use_pcgrad: true
  pcgrad_log_cosine: true   # logs gradient-cosine each step (diagnostic)

  # L-BFGS phase 2 — strong_wolfe line search for asymptotic convergence
  use_lbfgs_after_adam: true
  lbfgs_epochs: 200
  lbfgs_learning_rate: 1.0
  lbfgs_max_iter: 20
  lbfgs_history_size: 100
  lbfgs_line_search_fn: "strong_wolfe"

  run_validation: true
  batch_size_val: 500
  validation_interval: 100
  equatorial_sampling: false
  density_power: 1.0

pretraining:
  # Overlap pretraining for non-trivial chart-consistent start.
  # No bias: target is the chart-consistency requirement we're optimising anyway.
  identity_pretraining: false
  pretrain_epochs: 50
  pretrain_points: 2000
  overlap_pretraining: true
  overlap_pretrain_epochs: 200
  overlap_pretrain_points: 2000

loss_weights:
  # Both must be non-zero for PCGrad to have a 2nd task. Same weights as
  # previous runs so the comparison is clean.
  nijenhuis: 1.0
  overlap: 100.0
  overlap_size_alpha: 0.2
  overlap_size_beta: 0.2
  use_round_metric_contraction: false

logging:
  log_interval: 10
  checkpoint_interval: 500
  save_dir: "outputs/pcgrad_s3s3"
  test_size: 10000
  compute_block_diagonality: true   # ρ = (mean|B|+mean|C|) / (mean|A|+mean|D|)
  compute_nijenhuis_rank: true      # rank(N_J) as a linear map Λ²TM → TM

seed: 42

advanced:
  gradient_clipping: 1.0
  early_stopping: false
  early_stopping_patience: 100
