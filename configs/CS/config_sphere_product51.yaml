# Configuration for S^\alpha × S^\beta

geometry:
  manifold_type: "sphere_product"
  real_dimension_alpha: 5 
  real_dimension_beta: 1 

network:
  hidden_layers: [512, 1024, 1024, 1024, 1024, 512]
  activation: "gelu"
  use_fourier_features: true
  fourier_scale: 1.0
  num_fourier_features: 128
  initialization: "xavier"
  matrix_exp_terms: null
  use_residual_blocks: true

training:
  epochs: 10000
  batch_size: 500
  precision: 32  # 32 or 64
  learning_rate: 1.0e-3
  scheduler: "cosine"
  scheduler_params:
    T_max: 10000
    eta_min: 1.0e-6
  optimizer: "adamw"
  weight_decay: 1.0e-5
  run_validation: true
  batch_size_val: 500
  validation_interval: 100
  equatorial_sampling: false
  density_power: 1.0

pretraining:
  # identity_pretraining: drives A → 0 (so J ≡ ±J_0, Nijenhuis loss = 0 at start).
  # overlap_pretraining:  drives J → F⁻¹ J_0 F (so overlap loss ≈ 0 at start).
  # hopf_pretraining:     drives J → (DF)⁻¹ J_0 DF (analytic Hopf CS; only for dim_beta=1).
  # These are mutually exclusive: at most one may be set to true.
  identity_pretraining: true
  pretrain_epochs: 50
  pretrain_points: 2000
  overlap_pretraining: false
  overlap_pretrain_epochs: 200
  overlap_pretrain_points: 2000
  # overlap_pretrain_lr: 1.0e-3   # optional; defaults to training.learning_rate
  hopf_pretraining: false

loss_weights:
  nijenhuis: 1.0
  overlap: 100.0
  overlap_size_alpha: 0.2
  overlap_size_beta: 0.2
  use_round_metric_contraction: false

logging:
  log_interval: 10
  checkpoint_interval: 500
  save_dir: "outputs"
  test_size: 10000
  compute_block_diagonality: true  # compute off-diagonal ratio ρ = (mean|B|+mean|C|)/(mean|A|+mean|D|) for J block structure

seed: 42

advanced:
  gradient_clipping: 1.0
  early_stopping: false
  early_stopping_patience: 100
