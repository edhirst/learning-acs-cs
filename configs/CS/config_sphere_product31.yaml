# Configuration for S^\alpha × S^\beta

geometry:
  manifold_type: "sphere_product"
  real_dimension_alpha: 3 
  real_dimension_beta: 1 

network:
  hidden_layers: [32, 32]
  activation: "gelu"
  use_fourier_features: true
  fourier_scale: 1.0
  num_fourier_features: 12
  initialization: "xavier"
  matrix_exp_terms: null
  use_residual_blocks: false

training:
  epochs: 300
  batch_size: 150
  dtype: "float64"  
  learning_rate: 1.0e-3
  scheduler: "cosine"
  scheduler_params:
    T_max: 300
    eta_min: 1.0e-6
  optimizer: "gauss_newton"
  weight_decay: 1.0e-5
  run_validation: true
  batch_size_val: 150
  validation_interval: 50
  equatorial_sampling: false 
  density_power: 1.0
  gauss_newton_params:
    ema_decay: 0.95
    damping: 1.0
    adaptive_damping: false
    damping_up_factor: 3.0
    damping_down_factor: 0.5
    rho_threshold_bad: 0.25
    rho_threshold_good: 0.75

pretraining:
  # Identity pretraining drives A → 0 (so J ≡ ±J_0, Nijenhuis loss = 0 at start).
  # Overlap pretraining drives J → F⁻¹ J_0 F (so overlap loss ≈ 0 at start).
  # These are mutually exclusive: at most one of the two may be set to true.
  identity_pretraining: true
  pretrain_epochs: 50
  pretrain_points: 2000
  overlap_pretraining: false
  overlap_pretrain_epochs: 200
  overlap_pretrain_points: 2000
  # overlap_pretrain_lr: 1.0e-3   # optional; defaults to training.learning_rate

loss_weights:
  nijenhuis: 1.0
  overlap: 3.0
  overlap_size_alpha: 0.2
  overlap_size_beta: 0.2
  use_round_metric_contraction: false

logging:
  log_interval: 10
  checkpoint_interval: 50
  save_dir: "outputs"
  test_size: 10000

seed: 42

advanced:
  gradient_clipping: 1.0
  early_stopping: false
  early_stopping_patience: 100
