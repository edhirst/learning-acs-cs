# Round-1 derivative-program recipe (uniform across all manifolds):
#   fourier_scale 0.25 (Sobolev sweep winner: deriv err 35% -> 1.8%),
#   batch 2048, EMA 0.999, cosine_restarts, LBFGS finish, overlap pretrain.
# Architecture ceiling measured on S5xS1: mean Nij 1.14 / overlap 6.5e-2
# (600-step Sobolev fit, unconverged upper bound). Certified floor ~1e-10.
# Rev 2: overlap_pretrain_lr 3e-4 + 400 epochs (patch-(1,1) fp32 instability
# in rev 1: pretrain never converged, matrix_exp overflow cascade at epoch ~60).
# train.py now also skips non-finite-loss steps and aborts after 100 consecutive.

geometry:
  manifold_type: sphere_product
  real_dimension_alpha: 3
  real_dimension_beta: 1
network:
  hidden_layers:
  - 512
  - 1024
  - 1024
  - 1024
  - 1024
  - 512
  activation: gelu
  use_fourier_features: true
  fourier_scale: 0.25
  num_fourier_features: 128
  initialization: xavier
  matrix_exp_terms: null
  use_residual_blocks: true
training:
  epochs: 30000
  batch_size: 2048
  precision: 32
  learning_rate: 0.001
  scheduler: cosine_restarts
  scheduler_params:
    T_0: 3000
    T_mult: 1.5
    eta_min: 1.0e-06
  optimizer: adamw
  weight_decay: 1.0e-05
  ema_decay: 0.999
  use_lbfgs_after_adam: true
  lbfgs_epochs: 200
  lbfgs_learning_rate: 1.0
  lbfgs_max_iter: 20
  lbfgs_history_size: 100
  lbfgs_line_search_fn: strong_wolfe
  run_validation: true
  batch_size_val: 1000
  validation_interval: 100
  equatorial_sampling: false
  density_power: 1.0
pretraining:
  identity_pretraining: false
  pretrain_epochs: 50
  pretrain_points: 2000
  overlap_pretraining: true
  overlap_pretrain_epochs: 400
  overlap_pretrain_points: 2000
  hopf_pretraining: false
  overlap_pretrain_lr: 0.0003
loss_weights:
  nijenhuis: 1.0
  overlap: 100.0
  overlap_size_alpha: 0.2
  overlap_size_beta: 0.2
  use_round_metric_contraction: false
logging:
  log_interval: 10
  checkpoint_interval: 1000
  save_dir: outputs/D1_s3s1_cs
  test_size: 10000
  compute_block_diagonality: true
  compute_nijenhuis_rank: true
seed: 42
advanced:
  gradient_clipping: 1.0
  early_stopping: false
  early_stopping_patience: 100
