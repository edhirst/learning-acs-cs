# Hypothesis 1: The S^3 x S^1 CS recipe copied to S^3 x S^3 CS.
# Small MLP + w_overlap=3 + batch=1000. Tests whether heavy MLP + high w_overlap
# has been the actual bottleneck (S^3 x S^1 works at 2e-1 with this recipe).

geometry:
  manifold_type: sphere_product
  real_dimension_alpha: 3
  real_dimension_beta: 3
network:
  hidden_layers:
  - 256
  - 512
  - 512
  - 256
  activation: gelu
  use_fourier_features: true
  fourier_scale: 1.0
  num_fourier_features: 128
  initialization: xavier
  matrix_exp_terms: null
  use_residual_blocks: false
training:
  epochs: 30000
  batch_size: 1000
  precision: 32
  learning_rate: 0.001
  scheduler: cosine
  scheduler_params:
    T_max: 30000
    eta_min: 1.0e-07
  optimizer: adamw
  weight_decay: 1.0e-05
  use_lbfgs_after_adam: false
  lbfgs_epochs: 0
  lbfgs_learning_rate: 1.0
  lbfgs_max_iter: 20
  lbfgs_history_size: 100
  lbfgs_line_search_fn: strong_wolfe
  run_validation: true
  batch_size_val: 500
  validation_interval: 100
  equatorial_sampling: false
  density_power: 1.0
pretraining:
  identity_pretraining: true
  pretrain_epochs: 50
  pretrain_points: 2000
  overlap_pretraining: false
  overlap_pretrain_epochs: 200
  overlap_pretrain_points: 2000
loss_weights:
  nijenhuis: 1.0
  overlap: 3.0
  overlap_size_alpha: 0.2
  overlap_size_beta: 0.2
  use_round_metric_contraction: false
logging:
  log_interval: 10
  checkpoint_interval: 500
  save_dir: outputs/gpu_H1_s3s3_cs_light
  test_size: 10000
  compute_block_diagonality: true
  compute_nijenhuis_rank: true
seed: 42
advanced:
  gradient_clipping: 1.0
  early_stopping: false
  early_stopping_patience: 100
