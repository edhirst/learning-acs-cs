# Production recipe: random start, then three BEST-checkpoint continuations.
# Seed 7 gives stage seeds 7, 107, 207, 307. Other seeds test repeatability,
# not guaranteed convergence. Keep historical pilot configs unchanged.
seed: 7
common:
  case: s4xs1xs1
  task: acs
  formulation: ambient
  feat: all2+trilin
  hidden: [256, 256, 256, 256]
  sampling: uniform
  tail_weight: 0.0
  pool_size: 768
  replay_size: 256
  replay_refresh: 250
  replay_starts: 48
  replay_ascent_steps: 30
  replay_min_distance: 0.15
  replay_jitter: 0.03
  tail_fraction: 0.1
  tail_ramp: 0.2
  poly_lr: 0.005
  grad_clip: 1.0
  eval_every: 500
  validation_size: 4096
  audit_every: 2000
  audit_starts: 128
  audit_steps: 50
  boundary_starts: 512
  boundary_steps: 150
  lbfgs_chunk: 50
  lbfgs_batch: 1024
  admissible_max: 0.5
  target_max: 0.01
  target_rms: 0.0001
  checkpoint_every: 250
  threads: 1
  wall_minutes: 180.0
initial:
  poly_steps: 5000
  refine_steps: 5000
  batch: 192
  refine_lr: 0.001
  lr_min: 0.00001
  lbfgs_steps: 200
polish:
  poly_steps: 0
  refine_steps: 10000
  batch: 768
  refine_lr: 0.00001
  lr_min: 0.000001
  lbfgs_steps: 0
polish_seed_offsets: [100, 200, 300]
