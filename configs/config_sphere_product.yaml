# Configuration for S^\alpha × S^\beta

geometry:
  manifold_type: "sphere_product"
  real_dimension_alpha: 2    # real dimension of the first factor S^{m_α}
  real_dimension_beta: 2     # real dimension of the second factor S^{m_β}

network:
  hidden_layers: [256, 512, 512, 256]
  activation: "gelu"
  use_fourier_features: false
  fourier_scale: 1.0
  num_fourier_features: 128
  initialization: "xavier"

training:
  epochs: 200
  batch_size: 10000
  learning_rate: 5.0e-4
  scheduler: "cosine"
  scheduler_params:
    T_max: 2000
    eta_min: 1.0e-6
  optimizer: "adamw"
  weight_decay: 1.0e-4
  run_validation: false
  batch_size_val: 1024
  validation_split: 0.1
  validation_interval: 100

pretraining:
  identity_pretraining: true
  pretrain_epochs: 80
  pretrain_points: 1024

loss_weights:
  nijenhuis: 1.0
  overlap: 3.0
  overlap_size_alpha: 0.2
  overlap_size_beta: 0.2

logging:
  log_interval: 10
  checkpoint_interval: 500
  save_dir: "outputs"
  test_size: 5000

seed: 42

advanced:
  use_mixed_precision: false
  gradient_clipping: 1.0
  early_stopping: true
  early_stopping_patience: 2000
