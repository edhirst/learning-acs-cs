# Configuration for 4-sphere (S⁴)

geometry:
  manifold_type: "sphere"
  dimension: 4

network:
  hidden_layers: [128, 256, 256, 128]
  activation: "tanh"
  use_fourier_features: true
  fourier_scale: 1.0
  num_fourier_features: 64
  initialization: "xavier"

training:
  epochs: 10000
  batch_size: 1024
  learning_rate: 1.0e-3
  scheduler: "cosine"
  scheduler_params:
    T_max: 10000
    eta_min: 1.0e-6
  optimizer: "adam"
  weight_decay: 1.0e-5
  batch_size_val: 2048
  validation_split: 0.1
  validation_interval: 100

loss_weights:
  nijenhuis: 1.0
  overlap: 1.0
  overlap_size: 0.1

logging:
  log_interval: 10
  checkpoint_interval: 500
  save_dir: "outputs"

seed: 42

advanced:
  use_mixed_precision: false
  gradient_clipping: 1.0
  early_stopping: true
  early_stopping_patience: 1000
