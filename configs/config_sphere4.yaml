# Configuration for 4-sphere (S⁴)

geometry:
  manifold_type: "sphere"
  real_dimension: 4

network:
  hidden_layers: [128, 256, 256, 128]
  activation: "gelu"
  use_fourier_features: false
  fourier_scale: 1.0
  num_fourier_features: 64
  initialization: "xavier"

training:
  epochs: 100
  batch_size: 5000
  learning_rate: 1.0e-3
  scheduler: "cosine_restarts"
  scheduler_params:
    T_0: 300   
    T_mult: 2 
    eta_min: 1.0e-6
  optimizer: "adam"
  weight_decay: 1.0e-5
  run_validation: false
  batch_size_val: 100
  validation_split: 0.1
  validation_interval: 100

pretraining:
  identity_pretraining: true
  pretrain_epochs: 50
  pretrain_points: 1024

loss_weights:
  nijenhuis: 0.0
  overlap: 1.0
  overlap_size: 0.1

logging:
  log_interval: 10
  checkpoint_interval: 500
  save_dir: "outputs"
  test_size: 10000

seed: 42

advanced:
  use_mixed_precision: false
  gradient_clipping: 1.0
  early_stopping: true
  early_stopping_patience: 1000
