# Configuration for 6-sphere (S⁶)

geometry:
  manifold_type: "sphere"
  dimension: 6

network:
  hidden_layers: [256, 512, 512, 256]
  activation: "gelu"
  use_fourier_features: false
  fourier_scale: 1.0
  num_fourier_features: 128
  initialization: "xavier"

training:
  epochs: 1000
  batch_size: 5000
  learning_rate: 5.0e-4
  scheduler: "cosine_restarts"
  scheduler_params:
    T_0: 300   
    T_mult: 2  
    eta_min: 1.0e-7
  optimizer: "adamw"
  weight_decay: 1.0e-4
  run_validation: false
  batch_size_val: 4096
  validation_split: 0.1
  validation_interval: 100

pretraining:
  identity_pretraining: true
  pretrain_epochs: 80
  pretrain_points: 2048

loss_weights:
  nijenhuis: 1.0
  overlap: 3.0
  overlap_size: 0.1

logging:
  log_interval: 10
  checkpoint_interval: 1000
  save_dir: "outputs"
  test_size: 10000

seed: 42

advanced:
  use_mixed_precision: false
  gradient_clipping: 1.0
  early_stopping: true
  early_stopping_patience: 2000
