# S² ACS — Adam baseline for direct GN comparison.
# Matched architecture to config_sphere2_compare_gn.yaml.
# python train.py --config configs/ACS/config_sphere2_compare_adam.yaml

geometry:
  manifold_type: "sphere"
  real_dimension: 2

network:
  hidden_layers: [32, 32]
  activation: "gelu"
  use_fourier_features: true
  fourier_scale: 1.0
  num_fourier_features: 8
  initialization: "xavier"
  matrix_exp_terms: null
  use_residual_blocks: false

training:
  epochs: 200000
  batch_size: 200
  dtype: "float64"
  learning_rate: 1.0e-3
  scheduler: "cosine"
  scheduler_params:
    T_max: 200000
    eta_min: 1.0e-7
  optimizer: "adamw"
  weight_decay: 0.0
  run_validation: false   # train-only for clean loss-vs-time comparison
  batch_size_val: 200
  validation_interval: 500
  equatorial_sampling: false
  density_power: 1.0

pretraining:
  identity_pretraining: true
  pretrain_epochs: 50
  pretrain_points: 2000
  overlap_pretraining: false
  overlap_pretrain_epochs: 0
  overlap_pretrain_points: 2000

loss_weights:
  nijenhuis: 0.0
  overlap: 1.0
  overlap_size: 0.2
  use_round_metric_contraction: false

advanced:
  early_stopping: false
  early_stopping_patience: 500
  gradient_clipping: 1.0

logging:
  log_interval: 200
  checkpoint_interval: 40000
  save_dir: "outputs"
  test_size: 10000

seed: 42
