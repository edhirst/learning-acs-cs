# S³×S¹ ACS — Adam baseline for direct GN comparison.
# Matched architecture to config_sphere_product31_compare_gn.yaml.
# python train.py --config configs/ACS/config_sphere_product31_compare_adam.yaml

geometry:
  manifold_type: "sphere_product"
  real_dimension_alpha: 3
  real_dimension_beta: 1

network:
  hidden_layers: [32, 32]
  activation: "gelu"
  use_fourier_features: true
  fourier_scale: 1.0
  num_fourier_features: 12
  initialization: "xavier"
  matrix_exp_terms: null
  use_residual_blocks: false

training:
  epochs: 160000
  batch_size: 200
  dtype: "float64"
  learning_rate: 1.0e-3
  scheduler: "cosine"
  scheduler_params:
    T_max: 160000
    eta_min: 1.0e-7
  optimizer: "adamw"
  weight_decay: 0.0
  run_validation: false
  batch_size_val: 200
  validation_interval: 500
  equatorial_sampling: false
  density_power: 1.0

pretraining:
  identity_pretraining: true
  pretrain_epochs: 50
  pretrain_points: 2000
  overlap_pretraining: false
  overlap_pretrain_epochs: 0
  overlap_pretrain_points: 2000

loss_weights:
  nijenhuis: 0.0
  overlap: 1.0
  overlap_size_alpha: 0.2
  overlap_size_beta: 0.2
  use_round_metric_contraction: true

advanced:
  early_stopping: false
  early_stopping_patience: 500
  gradient_clipping: 1.0

logging:
  log_interval: 160
  checkpoint_interval: 32000
  save_dir: "outputs"
  test_size: 10000

seed: 42
