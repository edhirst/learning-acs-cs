# Configuration for 6-sphere (S⁶)

geometry:
  manifold_type: "sphere"
  real_dimension: 6

network:
  hidden_layers: [256, 512, 512, 256]
  activation: "gelu"
  use_fourier_features: true
  fourier_scale: 1.0
  num_fourier_features: 128
  initialization: "xavier"
  matrix_exp_terms: null
  use_residual_blocks: false

training:
  epochs: 10000
  batch_size: 1000
  precision: 64  # 32 or 64
  learning_rate: 1.0e-3
  scheduler: "cosine"
  scheduler_params:
    T_max: 10000
    eta_min: 1.0e-5
  optimizer: "adamw"
  weight_decay: 1.0e-5
  run_validation: true
  batch_size_val: 500
  validation_interval: 100
  equatorial_sampling: false  # sample radii from the overlap band, maximising gradient signal
  density_power: 1.0

pretraining:
  # Identity pretraining drives A → 0 (so J ≡ ±J_0, Nijenhuis loss = 0 at start).
  # Overlap pretraining drives J → F⁻¹ J_0 F (so overlap loss ≈ 0 at start).
  # These are mutually exclusive: at most one of the two may be set to true.
  identity_pretraining: true
  pretrain_epochs: 50
  pretrain_points: 2000
  overlap_pretraining: false
  overlap_pretrain_epochs: 200
  overlap_pretrain_points: 2000
  # overlap_pretrain_lr: 1.0e-3   # optional; defaults to training.learning_rate

loss_weights:
  nijenhuis: 0.0
  overlap: 1.0
  overlap_size: 0.2
  use_round_metric_contraction: false

logging:
  log_interval: 100
  checkpoint_interval: 1000
  save_dir: "outputs"
  test_size: 10000
  compute_nijenhuis_rank: true  # track average numerical rank of N_J as a linear map Λ²TM → TM at validation; rank 0 ↔ integrable
  compute_chern_metrics: true  # whether to compute Chern-number diagnostics during evaluation
seed: 67

advanced:
  gradient_clipping: 1.0
  early_stopping: false
  early_stopping_patience: 100
