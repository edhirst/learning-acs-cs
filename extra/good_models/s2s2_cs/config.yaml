advanced:
  early_stopping: false
  early_stopping_patience: 100
  gradient_clipping: 1.0
geometry:
  manifold_type: sphere_product
  real_dimension_alpha: 2
  real_dimension_beta: 2
logging:
  checkpoint_interval: 500
  log_interval: 10
  save_dir: outputs
  test_size: 10000
loss_weights:
  nijenhuis: 1.0
  overlap: 3.0
  overlap_size_alpha: 0.2
  overlap_size_beta: 0.2
network:
  activation: gelu
  fourier_scale: 1.0
  hidden_layers:
  - 256
  - 512
  - 512
  - 256
  initialization: xavier
  matrix_exp_terms: null
  num_fourier_features: 128
  use_fourier_features: true
pretraining:
  identity_pretraining: true
  pretrain_epochs: 50
  pretrain_points: 2000
seed: 42
training:
  batch_size: 1000
  batch_size_val: 500
  density_power: 1.0
  dtype: float64
  epochs: 10000
  equatorial_sampling: false
  learning_rate: 0.001
  optimizer: adamw
  run_validation: true
  scheduler: cosine
  scheduler_params:
    T_max: 10000
    eta_min: 1.0e-06
  validation_interval: 100
  weight_decay: 1.0e-05
