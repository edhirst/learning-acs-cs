advanced:
  early_stopping: true
  early_stopping_patience: 1000
  gradient_clipping: 1.0
  use_mixed_precision: false
geometry:
  real_dimension: 4
  manifold_type: sphere
logging:
  checkpoint_interval: 500
  log_interval: 10
  save_dir: outputs
  test_size: 10000
loss_weights:
  nijenhuis: 1.0
  overlap: 1.0
  overlap_size: 0.1
network:
  activation: tanh
  fourier_scale: 1.0
  hidden_layers:
  - 128
  - 256
  - 256
  - 128
  initialization: xavier
  num_fourier_features: 64
  use_fourier_features: false
pretraining:
  identity_pretraining: true
  pretrain_epochs: 50
  pretrain_points: 1024
seed: 42
training:
  batch_size: 1000
  batch_size_val: 100
  epochs: 200
  learning_rate: 0.001
  optimizer: adam
  run_validation: false
  scheduler: cosine_restarts
  scheduler_params:
    T_0: 300
    T_mult: 2
    eta_min: 1.0e-06
  validation_interval: 100
  validation_split: 0.1
  weight_decay: 1.0e-05
