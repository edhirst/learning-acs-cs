advanced:
  early_stopping: true
  early_stopping_patience: 1000
  gradient_clipping: 1.0
  use_mixed_precision: false
geometry:
  real_dimension: 2
  manifold_type: sphere
logging:
  checkpoint_interval: 500
  log_interval: 10
  save_dir: outputs
  test_size: 10000
loss_weights:
  nijenhuis: 0.0
  overlap: 1.0
  overlap_size: 0.2
network:
  activation: gelu
  fourier_scale: 1.0
  hidden_layers:
  - 64
  - 128
  - 128
  - 64
  initialization: xavier
  num_fourier_features: 16
  use_fourier_features: true
pretraining:
  identity_pretraining: true
  pretrain_epochs: 30
  pretrain_points: 1024
seed: 42
training:
  batch_size: 50000
  batch_size_val: 1024
  epochs: 1000
  learning_rate: 0.001
  optimizer: adam
  run_validation: false
  scheduler: cosine
  scheduler_params:
    T_max: 1000
    eta_min: 1.0e-06
  validation_interval: 50
  validation_split: 0.1
  weight_decay: 1.0e-05
